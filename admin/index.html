<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Admin · Content Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Google Material Symbols Outlined -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="/assets/style.css">
<style>
/* Lock Viewport & Prevent Layout Shift */
html {
  overflow-y: scroll;
}
.wrap {
  width: 100%;
  max-width: 1100px;
  min-width: 320px;
  margin: 0 auto;
  padding: 16px;
  box-sizing: border-box;
}
#contentArea, .panel, .canvas-card, .client-subnav-bar {
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
}

/* Material Symbols Outlined */
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  font-size: 18px;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  -webkit-font-smoothing: antialiased;
  vertical-align: -3px;
}

button:not(.day), a.fab-item, .view-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.login{max-width:380px;margin:60px auto}

/* Loading Spinner */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.35);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Dashboard Styles */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.1;margin-top:6px}
.kpi span{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

.client-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px}
.client-card{background:var(--head);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s ease,transform .15s ease}
.client-card:hover{border-color:var(--sel);transform:translateY(-2px)}
.client-card-head{display:flex;align-items:center;justify-content:space-between}
.client-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}

/* Client Square Logo Avatar (Instagram-style) */
.client-logo-avatar{width:38px;height:38px;border-radius:10px;object-fit:cover;border:1.5px solid var(--line);flex-shrink:0;background:var(--card)}
.client-logo-placeholder{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}

.color-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.client-stats{display:flex;gap:14px;font-size:12px;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:8px;margin-top:4px}
.client-stats b{font-weight:700;color:var(--ink)}

/* Header Menu Dropdown */
.header-dropdown{position:absolute;top:calc(100% + 8px);right:0;z-index:1000;background:var(--card);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,0.18);width:260px;padding:8px;display:none;flex-direction:column;gap:2px}
.header-dropdown.open{display:flex}
.fab-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:0;background:transparent;color:var(--ink);font-size:13.5px;cursor:pointer;text-align:left;width:100%;text-decoration:none;transition:background-color .18s ease;box-shadow:none !important}
.fab-item:hover{background:color-mix(in srgb,var(--head) 75%,white);box-shadow:none !important}
.fab-item.danger{color:var(--bad)}
.fab-divider{height:1px;background:var(--line);margin:5px 0}

/* Pinned Client Subnav Bar - Explicit Light Mode (Only Sub Navbar) */
.client-subnav-bar{position:-webkit-sticky;position:sticky;top:10px;z-index:90;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 16px;background:#ffffff !important;color:#141413 !important;border:1.5px solid #E8E6DC !important;border-radius:14px;padding:8px 12px;box-shadow:none !important}
.client-subnav-bar .view-toggle{background:#F0EEE6 !important;border:1px solid #E8E6DC !important;padding:3px;border-radius:999px;display:inline-flex;gap:2px;flex-wrap:wrap}
.client-subnav-bar .view-btn{border:0 !important;background:transparent !important;color:#55544E !important;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;transition:background-color .18s ease,color .18s ease;box-shadow:none !important;display:inline-flex;align-items:center;gap:5px}
.client-subnav-bar .view-btn .material-symbols-outlined{color:inherit !important;font-size:17px}
.client-subnav-bar .view-btn:hover:not(.on){background-color:#ffffff !important;color:#141413 !important;box-shadow:none !important}
.client-subnav-bar .view-btn.on{background:#141413 !important;color:#ffffff !important}
.client-subnav-bar .view-btn.on:hover{background-color:#2b2b29 !important;color:#ffffff !important;box-shadow:none !important}
.client-subnav-bar #subnavAddPost{background:#141413 !important;color:#ffffff !important;border:1.5px solid #141413 !important;box-shadow:none !important}
.client-subnav-bar #subnavAddPost:hover{background-color:#2e2e2c !important;border-color:#2e2e2c !important;color:#ffffff !important;box-shadow:none !important}

/* Mobile & Touch Responsive Optimization */
@media(max-width:640px){
  header{padding:14px 16px;gap:10px}
  .client-subnav-bar{
    top:6px;
    padding:6px 8px;
    gap:8px;
    flex-wrap:nowrap;
    align-items:center;
  }
  .client-subnav-bar .view-toggle{
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    max-width:calc(100% - 94px);
  }
  .client-subnav-bar .view-toggle::-webkit-scrollbar{display:none}
  .client-subnav-bar .view-btn{
    white-space:nowrap;
    flex-shrink:0;
    padding:5px 10px;
    font-size:12px;
  }
  .client-subnav-bar #subnavAddPost{
    white-space:nowrap;
    flex-shrink:0;
    padding:5px 10px;
    font-size:12px;
  }
  .client-switcher-wrap{width:100%}
  .client-switcher-btn{width:100%;max-width:100%;justify-content:space-between}
  .switcher-btn-name{max-width:none;flex:1}
  .client-switcher-popover{width:100%;max-width:100%;left:0;right:0}
  .row{grid-template-columns:1fr;gap:6px;padding:10px 0}
  .row .d{grid-column:auto}
  .row > div:last-child{justify-content:flex-start !important;margin-top:4px}
  .two{grid-template-columns:1fr}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi{padding:12px 14px}
  .kpi b{font-size:20px}
  .kpi span{font-size:10.5px}
  .client-cards{grid-template-columns:1fr}
}

/* Button Hover Animation - Subtle Lighten (No Shadow) */
button:not(.day), a.fab-item, .view-btn, .tick-btn{transition:background-color .18s ease,border-color .18s ease,color .18s ease;box-shadow:none !important}
button:not(.day):hover:not(:disabled){background-color:color-mix(in srgb,var(--card) 85%,white);border-color:color-mix(in srgb,var(--line) 75%,white);box-shadow:none !important}
button.on:hover:not(:disabled),button.pri:hover:not(:disabled){background-color:color-mix(in srgb,var(--sel) 84%,white);border-color:color-mix(in srgb,var(--sel) 84%,white);color:var(--bg);box-shadow:none !important}
button.danger:hover:not(:disabled){background-color:color-mix(in srgb,var(--bad) 8%,var(--card));border-color:color-mix(in srgb,var(--bad) 75%,white);color:color-mix(in srgb,var(--bad) 85%,white);box-shadow:none !important}

/* Tick Button for Posted Verification */
.tick-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer;transition:background-color .18s ease,border-color .18s ease,color .18s ease;user-select:none;box-shadow:none !important}
.tick-btn:hover{background-color:color-mix(in srgb,var(--card) 85%,white);border-color:#2E7D32;color:#2E7D32;box-shadow:none !important}
.tick-btn.ticked{background:#E8F5E9;border-color:#2E7D32;color:#1B5E20;font-weight:600}
.tick-btn.ticked:hover{background:#F1F8F1;box-shadow:none !important}
@media(prefers-color-scheme:dark){.tick-btn.ticked{background:#1B3820;border-color:#4CAF50;color:#A5D6A7}.tick-btn.ticked:hover{background:#234729;box-shadow:none !important}}

/* View Toggle (List vs Calendar vs Feed vs Canvas) */
.view-toggle{display:inline-flex;background:var(--head);padding:3px;border-radius:999px;border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.view-btn{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:background-color .18s ease,color .18s ease;box-shadow:none !important}
.view-btn:hover:not(.on){background-color:color-mix(in srgb,var(--head) 65%,white);color:var(--ink);box-shadow:none !important}
.view-btn.on{background:var(--sel);color:var(--bg)}
.view-btn.on:hover{background-color:color-mix(in srgb,var(--sel) 84%,white);color:var(--bg);box-shadow:none !important}

/* Modal Popups (Edit Client, New Client, Add Post, Confirmations) */
.modal-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.48);backdrop-filter:blur(3px);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px 24px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 16px 40px rgba(0,0,0,0.22);animation:scaleIn .15s ease-out}
@keyframes scaleIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-close-btn{background:transparent;border:0;cursor:pointer;padding:4px;border-radius:50%;color:var(--mute);display:flex;align-items:center;justify-content:center}
.modal-close-btn:hover{background:var(--head);color:var(--ink)}
.modal-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.modal-header h3{margin:0;font-size:19px;font-weight:600}
.modal-icon-warn{color:var(--bad);font-size:26px}
.modal-body{font-size:14px;color:var(--ink);line-height:1.5;margin:0 0 16px}
.modal-actions{display:flex;align-items:center;gap:10px;margin-top:16px}

/* Canvas Styles (White Theme with Dark Font) */
.canvas-card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.canvas-pill{display:inline-flex;align-items:center;gap:6px;background:var(--head);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.canvas-pill button{border:0;background:transparent;cursor:pointer;color:var(--mute);padding:0;font-size:14px;display:flex}
.canvas-pill button:hover{color:var(--bad)}
.doc-link{display:flex;align-items:center;justify-content:space-between;background:var(--head);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.doc-link a{color:var(--ink);text-decoration:none;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.doc-link a:hover{color:var(--accent)}

/* White Document Theme for Content Strategy Canvas */
.white-canvas-doc {
  background: #ffffff !important;
  color: #141413 !important;
  border: 1px solid #e2e0d8 !important;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  border-radius: 12px;
  padding: 24px 28px;
  line-height: 1.65;
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
.white-canvas-doc h1, .white-canvas-doc h2, .white-canvas-doc h3, .white-canvas-doc h4 {
  color: #111111 !important;
}
.white-canvas-doc blockquote {
  background: #f7f6f2 !important;
  color: #3b3b3a !important;
  border-left: 4px solid var(--accent, #D97757) !important;
  padding: 10px 14px;
  margin: 10px 0;
  border-radius: 0 8px 8px 0;
}
.white-canvas-doc a {
  color: var(--accent, #D97757) !important;
}
.white-canvas-input {
  background: #ffffff !important;
  color: #141413 !important;
  border: 1px solid #d4d2c9 !important;
  border-radius: 10px;
  padding: 16px;
  font-family: 'DM Sans', monospace, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  width: 100%;
  box-sizing: border-box;
}

/* Instagram 3-Column Feed View */
.insta-feed-wrap {
  max-width: 520px;
  margin: 0 auto;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  box-sizing: border-box;
}
.insta-profile-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.insta-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
}
.insta-cell {
  aspect-ratio: 1 / 1;
  position: relative;
  background: #1c1c1e;
  color: #ffffff;
  overflow: hidden;
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 8px;
  user-select: none;
}
.insta-cell img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  top: 0; left: 0;
}
.insta-cell-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.72);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 6px;
  opacity: 0;
  transition: opacity 0.15s ease;
  padding: 8px;
  z-index: 3;
}
.insta-cell:hover .insta-cell-overlay {
  opacity: 1;
}
.insta-type-icon {
  position: absolute;
  top: 6px;
  right: 6px;
  color: #fff;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));
  z-index: 2;
}
.insta-posted-icon {
  position: absolute;
  bottom: 6px;
  left: 6px;
  color: #4CAF50;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));
  z-index: 2;
}

/* Option 1: Modern Interactive Workspace Switcher (Linear/Vercel style) */
.client-switcher-wrap{position:relative;display:inline-flex}
.client-switcher-btn{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);text-align:left;user-select:none;transition:background-color .18s ease,border-color .18s ease;box-shadow:none !important;max-width:280px}
.client-switcher-btn:hover{background-color:color-mix(in srgb,var(--card) 85%,white);border-color:color-mix(in srgb,var(--line) 75%,white);box-shadow:none !important}
.switcher-btn-logo{width:20px;height:20px;border-radius:6px;object-fit:cover;flex-shrink:0}
.switcher-btn-dot{width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
.switcher-btn-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;font-weight:600}
.switcher-chevron{font-size:16px;color:var(--mute);flex-shrink:0;margin-left:-2px}
.switcher-kbd{font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-weight:700;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:2px;line-height:1.4;flex-shrink:0}
.client-switcher-popover{position:absolute;top:calc(100% + 8px);left:0;z-index:1000;width:340px;max-width:calc(100vw - 32px);background:var(--card);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 16px 36px rgba(0,0,0,0.18);display:none;flex-direction:column;overflow:hidden}
.client-switcher-popover.open{display:flex}
.switcher-search-box{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.switcher-search-input{flex:1;border:0 !important;outline:none !important;background:transparent !important;color:var(--ink);font-size:13.5px;padding:0 !important;box-shadow:none !important}
.switcher-search-clear{border:0 !important;background:transparent !important;padding:2px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;box-shadow:none !important}
.switcher-search-clear:hover{background:color-mix(in srgb,var(--head) 75%,white) !important}
.switcher-body{max-height:320px;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:2px}
.switcher-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:6px 8px 3px;display:flex;align-items:center;justify-content:space-between}
.switcher-recent-row{display:flex;gap:6px;overflow-x:auto;padding:4px 6px 8px;scrollbar-width:none}
.switcher-recent-row::-webkit-scrollbar{display:none}
.switcher-recent-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--head) 65%,white);border:1px solid var(--line);color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background-color .15s ease;box-shadow:none !important}
.switcher-recent-pill:hover{background:color-mix(in srgb,var(--head) 85%,white);box-shadow:none !important}
.switcher-list{display:flex;flex-direction:column;gap:2px}
.switcher-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;transition:background-color .15s ease;box-shadow:none !important;text-decoration:none;color:var(--ink)}
.switcher-item:hover, .switcher-item.selected{background:color-mix(in srgb,var(--head) 75%,white);box-shadow:none !important}
.switcher-item.active-client{background:color-mix(in srgb,var(--head) 45%,white)}
.switcher-item-logo{width:26px;height:26px;border-radius:7px;object-fit:cover;flex-shrink:0}
.switcher-item-dot{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
.switcher-item-meta{flex:1;min-width:0;display:flex;flex-direction:column}
.switcher-item-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switcher-item-sub{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switcher-empty{padding:24px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mute)}
.switcher-footer{padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--head) 30%,transparent)}
.switcher-footer-btn{border:0 !important;background:transparent !important;color:var(--ink) !important;font-size:12px !important;font-weight:600;padding:4px 8px !important;border-radius:6px !important;cursor:pointer;display:inline-flex;align-items:center;gap:5px;box-shadow:none !important}
.switcher-footer-btn:hover{background:color-mix(in srgb,var(--head) 80%,white) !important;box-shadow:none !important}
.switcher-footer-hints{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--mute);padding:0 4px}
.switcher-footer-hints kbd{font-family:inherit;font-size:10px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:1px 4px}

/* Print PDF Styles */
@media print {
  body {
    background: #fff !important;
    color: #000 !important;
  }
  header, .bar, .client-subnav-bar, .modal-backdrop, button, input, select, textarea, .view-toggle, .msg {
    display: none !important;
  }
  .wrap {
    max-width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  #contentArea {
    width: 100% !important;
  }
  .canvas-card {
    border: 1px solid #ddd !important;
    box-shadow: none !important;
    page-break-inside: avoid;
  }
  .white-canvas-doc {
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
  }
}
</style>
</head><body><div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/assets/config.js"></script>
<script>
const sb=supabase.createClient(CFG.url,CFG.key),$=id=>document.getElementById(id),app=$("app");
const pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=new Date(),TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;

let clients=[],cur=null,posts=[],allPosts=[];
let adminView="overview",adminCalY=now.getFullYear(),adminCalM=now.getMonth(),adminCalFilter="All",adminCalSel=TODAY;
let showPastPosted=false;
const isMac=typeof navigator!=="undefined"&&/Mac|iPhone|iPad|iPod/.test(navigator.platform||navigator.userAgent);
const switcherKbdLabel=isMac?"⌘K":"Ctrl+K";
let switcherOpen=false,switcherHighlightedIndex=0,switcherFilteredClients=[];

function getRecentClientIds(){
 try{
  const raw=localStorage.getItem("tc_recent_cids");
  if(!raw)return [];
  const arr=JSON.parse(raw);
  return Array.isArray(arr)?arr:[];
 }catch(e){return [];}
}

function recordRecentClient(cid){
 if(!cid)return;
 try{
  let list=getRecentClientIds().filter(id=>id!==cid);
  list.unshift(cid);
  list=list.slice(0,5);
  localStorage.setItem("tc_recent_cids",JSON.stringify(list));
 }catch(e){}
}

async function selectClientById(cid){
 if(!cid){
  cur=null;
  shell();
  await loadDashboard();
 }else{
  cur=clients.find(c=>c.id===cid)||null;
  if(cur){
   recordRecentClient(cur.id);
   adminView="overview";
   shell();
   await loadPosts();
  }else{
   cur=null;
   shell();
   await loadDashboard();
  }
 }
}
const slugify=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function generateUniqueSlug(name, existingId=null){
 let base=slugify(name)||"client";
 let s=base,counter=2;
 while(clients.some(cl=>cl.slug===s&&cl.id!==existingId)){
  s=`${base}-${counter}`;
  counter++;
 }
 return s;
}

async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 session?await home():loginView();
}

function loginView(msg=""){
 app.innerHTML=`<div class="panel login">
  <h2>Team login</h2>
  <p class="muted">Content calendar admin</p>
  <label>Email</label>
  <input id="em" type="email" autocomplete="username">
  <label>Password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <p class="msg" id="msg">${esc(msg)}</p>
  <div class="bar">
   <button class="pri" id="in"><span class="material-symbols-outlined">login</span> Log in</button>
   <button id="up"><span class="material-symbols-outlined">person_add</span> Create account</button>
  </div>
  <p class="muted">The first account created becomes the admin. Later accounts need an admin's approval.</p>
 </div>`;

 const go=async(btn,fn,label,icon)=>{
  $("msg").textContent="";
  const em=$("em").value.trim(),pw=$("pw").value;
  if(!em||!pw){$("msg").textContent="Please enter email and password.";return}
  btn.disabled=true;
  btn.innerHTML=`<span class="spinner"></span> ${label}…`;
  try{
   const {error}=await fn(em,pw);
   if(error){
    $("msg").textContent=error.message;
    btn.disabled=false;
    btn.innerHTML=`<span class="material-symbols-outlined">${icon}</span> ${label}`;
   }else{
    boot();
   }
  }catch(err){
   $("msg").textContent=err.message||"An error occurred.";
   btn.disabled=false;
   btn.innerHTML=`<span class="material-symbols-outlined">${icon}</span> ${label}`;
  }
 };

 $("in").onclick=()=>go($("in"),(email,password)=>sb.auth.signInWithPassword({email,password}),"Log in","login");
 $("up").onclick=()=>go($("up"),(email,password)=>sb.auth.signUp({email,password}),"Create account","person_add");
 [$("em"),$("pw")].forEach(inp=>inp.onkeydown=e=>{if(e.key==="Enter")$("in").click()});
}

const out=async()=>{await sb.auth.signOut();cur=null;loginView()};

async function home(){
 const {data:tm}=await sb.from("team_members").select("user_id");
 if(!(tm&&tm.length)){
  app.innerHTML=`<div class="panel login"><h2>Waiting for access</h2><p class="muted">You're signed in, but an admin hasn't added you to the team yet.</p><button id="out"><span class="material-symbols-outlined">logout</span> Log out</button></div>`;
  $("out").onclick=out;
  return;
 }
 const {data}=await sb.from("clients").select("*").order("name");
 clients=data||[];

 try{
  const {data:accs}=await sb.from("client_accounts").select("client_id,username");
  if(accs&&accs.length){
   const m=Object.fromEntries(accs.map(a=>[a.client_id,a.username]));
   clients=clients.map(cl=>({...cl,username:m[cl.id]||""}));
  }
 }catch(e){}

 clients=clients.map(cl=>{
  const cachedLogo=localStorage.getItem("tc_logo_"+cl.id);
  return {...cl,logo_url:cl.logo_url||cachedLogo||""};
 });

 if(cur){cur=clients.find(c=>c.id===cur.id)||null}
 shell();
 if(cur){await loadPosts()}else{await loadDashboard()}
}

// Modal Manager
function openModal(html){
 closeModal();
 const modalEl=document.createElement("div");
 modalEl.id="appModal";
 modalEl.className="modal-backdrop";
 modalEl.innerHTML=`<div class="modal-box">${html}</div>`;
 document.body.appendChild(modalEl);
 modalEl.onclick=e=>{if(e.target===modalEl)closeModal()};
 return modalEl;
}
function closeModal(){
 const m=$("appModal");
 if(m)m.remove();
}

function closeHeaderMenu(){
 const m=$("headerDropdown");
 if(m)m.classList.remove("open");
}

function renderSwitcherList(query=""){
 const body=$("switcherBody");
 if(!body)return;
 const q=(query||"").trim().toLowerCase();
 const clearBtn=$("switcherClearBtn");
 if(clearBtn)clearBtn.style.display=q?"inline-flex":"none";

 const recents=getRecentClientIds().map(id=>clients.find(c=>c.id===id)).filter(Boolean);

 let filtered=[];
 if(!q){
  filtered=clients;
 }else{
  filtered=clients.filter(c=>{
   const n=(c.name||"").toLowerCase();
   const u=(c.username||"").toLowerCase();
   const s=(c.slug||"").toLowerCase();
   return n.includes(q)||u.includes(q)||s.includes(q);
  });
 }
 switcherFilteredClients=filtered;
 if(switcherHighlightedIndex>=filtered.length){
  switcherHighlightedIndex=Math.max(0,filtered.length-1);
 }

 let html="";

 if(!q&&recents.length>0){
  html+=`
   <div class="switcher-section-title">
    <span>Recent</span>
   </div>
   <div class="switcher-recent-row">
    ${recents.map(rc=>`
     <button type="button" class="switcher-recent-pill" data-switcher-cid="${rc.id}" title="${esc(rc.name)}">
      ${rc.logo_url?`
       <img src="${esc(rc.logo_url)}" style="width:16px;height:16px;border-radius:4px;object-fit:cover" alt="">
      `:`
       <span class="color-dot" style="background:${rc.accent_color||'#D97757'};width:8px;height:8px"></span>
      `}
      <span style="max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(rc.name)}</span>
     </button>
    `).join("")}
   </div>
   <div class="fab-divider" style="margin:2px 0 4px"></div>
  `;
 }

 html+=`
  <div class="switcher-section-title">
   <span>${q?"Matching Clients":"All Clients"}</span>
   <span style="font-weight:600;font-size:10.5px">${filtered.length}</span>
  </div>
 `;

 if(filtered.length===0){
  html+=`
   <div class="switcher-empty">
    <span class="material-symbols-outlined" style="font-size:26px;color:var(--mute);margin-bottom:6px">search_off</span>
    <div style="font-size:13px;font-weight:600;color:var(--ink)">No clients found</div>
    <div style="font-size:11.5px;color:var(--mute);margin-top:2px">No match for "${esc(q)}"</div>
   </div>
  `;
 }else{
  html+=`<div class="switcher-list" id="switcherItemsList">`;
  filtered.forEach((c,idx)=>{
   const isCur=cur&&cur.id===c.id;
   const isSelected=idx===switcherHighlightedIndex;
   const postCount=allPosts&&allPosts.length?allPosts.filter(p=>p.client_id===c.id).length:null;
   html+=`
    <button type="button"
     class="switcher-item ${isCur?'active-client':''} ${isSelected?'selected':''}"
     data-switcher-cid="${c.id}"
     data-switcher-index="${idx}"
     role="option"
     aria-selected="${isCur?'true':'false'}">
     ${c.logo_url?`
      <img src="${esc(c.logo_url)}" class="switcher-item-logo" alt="">
     `:`
      <span class="switcher-item-dot" style="background:${c.accent_color||'#D97757'}">
       ${esc((c.name.charAt(0)||'C').toUpperCase())}
      </span>
     `}
     <div class="switcher-item-meta">
      <div class="switcher-item-name">${esc(c.name)}</div>
      <div class="switcher-item-sub">
       ${c.username?`@${esc(c.username)}`:(c.slug?`/${esc(c.slug)}`:esc(c.name))}
       ${postCount!==null?` · ${postCount} post${postCount===1?'':'s'}`:''}
      </div>
     </div>
     ${isCur?`
      <span class="material-symbols-outlined" style="font-size:18px;color:var(--sel);margin-left:auto;flex-shrink:0">check</span>
     `:''}
    </button>
   `;
  });
  html+=`</div>`;
 }

 body.innerHTML=html;

 body.querySelectorAll("[data-switcher-cid]").forEach(btn=>{
  btn.onclick=async e=>{
   e.stopPropagation();
   const cid=btn.dataset.switcherCid;
   closeClientSwitcher();
   await selectClientById(cid);
  };
  btn.onmouseenter=()=>{
   if(btn.dataset.switcherIndex!==undefined){
    switcherHighlightedIndex=parseInt(btn.dataset.switcherIndex,10);
    updateSwitcherHighlightDOM();
   }
  };
 });
}

function updateSwitcherHighlightDOM(){
 const items=document.querySelectorAll("#switcherItemsList .switcher-item");
 items.forEach((item,idx)=>{
  if(idx===switcherHighlightedIndex){
   item.classList.add("selected");
   item.scrollIntoView({block:"nearest"});
  }else{
   item.classList.remove("selected");
  }
 });
}

function moveSwitcherHighlight(delta){
 if(!switcherFilteredClients.length)return;
 switcherHighlightedIndex=(switcherHighlightedIndex+delta+switcherFilteredClients.length)%switcherFilteredClients.length;
 updateSwitcherHighlightDOM();
}

async function selectHighlightedSwitcherItem(){
 if(switcherFilteredClients.length>0&&switcherFilteredClients[switcherHighlightedIndex]){
  const chosen=switcherFilteredClients[switcherHighlightedIndex];
  closeClientSwitcher();
  await selectClientById(chosen.id);
 }
}

function openClientSwitcher(){
 const pop=$("clientSwitcherDropdown");
 const btn=$("clientSwitcherBtn");
 if(!pop||!btn)return;
 closeHeaderMenu();
 pop.classList.add("open");
 btn.setAttribute("aria-expanded","true");
 switcherOpen=true;

 const inp=$("switcherSearchInput");
 if(inp){
  inp.value="";
  setTimeout(()=>inp.focus(),20);
 }

 if(cur){
  const idx=clients.findIndex(c=>c.id===cur.id);
  switcherHighlightedIndex=idx>=0?idx:0;
 }else{
  switcherHighlightedIndex=0;
 }
 renderSwitcherList("");
}

function closeClientSwitcher(){
 const pop=$("clientSwitcherDropdown");
 const btn=$("clientSwitcherBtn");
 if(pop)pop.classList.remove("open");
 if(btn)btn.setAttribute("aria-expanded","false");
 switcherOpen=false;
}

function wireClientSwitcher(){
 const sBtn=$("clientSwitcherBtn");
 if(sBtn){
  sBtn.onclick=e=>{
   e.stopPropagation();
   if(switcherOpen){
    closeClientSwitcher();
   }else{
    openClientSwitcher();
   }
  };
 }

 const sHome=$("switcherHomeBtn");
 if(sHome){
  sHome.onclick=async e=>{
   e.stopPropagation();
   closeClientSwitcher();
   await selectClientById(null);
  };
 }

 const sNew=$("switcherNewBtn");
 if(sNew){
  sNew.onclick=e=>{
   e.stopPropagation();
   closeClientSwitcher();
   clientForm(null);
  };
 }

 const sInput=$("switcherSearchInput");
 if(sInput){
  sInput.oninput=e=>{
   switcherHighlightedIndex=0;
   renderSwitcherList(e.target.value);
  };
  sInput.onclick=e=>e.stopPropagation();
  sInput.onkeydown=e=>{
   if(e.key==="ArrowDown"){
    e.preventDefault();
    moveSwitcherHighlight(1);
   }else if(e.key==="ArrowUp"){
    e.preventDefault();
    moveSwitcherHighlight(-1);
   }else if(e.key==="Enter"){
    e.preventDefault();
    selectHighlightedSwitcherItem();
   }else if(e.key==="Escape"){
    e.preventDefault();
    closeClientSwitcher();
    $("clientSwitcherBtn")?.focus();
   }
  };
 }

 const sClear=$("switcherClearBtn");
 if(sClear){
  sClear.onclick=e=>{
   e.stopPropagation();
   if(sInput){
    sInput.value="";
    sInput.focus();
    switcherHighlightedIndex=0;
    renderSwitcherList("");
   }
  };
 }
}

// Universal Popup Modal for Delete Actions
function confirmModal({ title, message, confirmText="Delete", requireMatch=null, onConfirm }){
 const existing=$("customModal");
 if(existing)existing.remove();

 const modalEl=document.createElement("div");
 modalEl.id="customModal";
 modalEl.className="modal-backdrop";
 modalEl.innerHTML=`
  <div class="modal-box">
   <div class="modal-header">
    <span class="material-symbols-outlined modal-icon-warn">warning</span>
    <h3>${title}</h3>
   </div>
   <div class="modal-body">${message}</div>
   ${requireMatch?`
    <div style="margin-top:12px">
     <label style="font-size:13px;color:var(--mute)">Type <b>${esc(requireMatch)}</b> below to verify:</label>
     <input id="modalMatchInput" placeholder="${esc(requireMatch)}" autocomplete="off" style="margin-top:4px">
    </div>
   `:""}
   <div class="bar modal-actions">
    <span class="sp"></span>
    <button id="modalCancelBtn" type="button">Cancel</button>
    <button class="danger" id="modalConfirmBtn" type="button" ${requireMatch?'disabled':''}>
     <span class="material-symbols-outlined" style="font-size:16px">delete</span> ${confirmText}
    </button>
   </div>
  </div>`;
 document.body.appendChild(modalEl);

 const close=()=>modalEl.remove();
 $("modalCancelBtn").onclick=close;
 modalEl.onclick=e=>{if(e.target===modalEl)close()};

 if(requireMatch){
  const inp=$("modalMatchInput");
  const btn=$("modalConfirmBtn");
  inp.focus();
  inp.oninput=()=>{
   btn.disabled=inp.value.trim().toLowerCase()!==requireMatch.trim().toLowerCase();
  };
  inp.onkeydown=e=>{
   if(e.key==="Enter"&&!btn.disabled)$("modalConfirmBtn").click();
  };
 }

 $("modalConfirmBtn").onclick=async()=>{
  $("modalConfirmBtn").disabled=true;
  $("modalConfirmBtn").innerHTML=`<span class="spinner"></span> Deleting…`;
  try{
   await onConfirm();
   close();
  }catch(err){
   alert("Error: "+(err.message||err));
   close();
  }
 };
}

function confirmDeletePost(postId){

 const p=posts.find(x=>x.id===postId)||allPosts.find(x=>x.id===postId);

 confirmModal({
  title:"Delete post?",
  message:`Are you sure you want to delete this scheduled post <b>${info}</b>? This action cannot be undone.`,
  confirmText:"Delete post",
  onConfirm:async()=>{
   const {error}=await sb.from("posts").delete().eq("id",postId);

   if(cur)await loadPosts();
   else await loadDashboard();

 });
}

function confirmDeleteClient(targetClient){

  title:`Delete client "${esc(client.name)}"?`,
  message:`This will permanently delete <b>${esc(client.name)}</b>, their logo, client portal login credentials, and all scheduled calendar posts.<br><br>This action cannot be undone.`,
  requireMatch:client.name,

  onConfirm:async()=>{

   await sb.from("posts").delete().eq("client_id",clientId);
   try{await sb.from("client_accounts").delete().eq("client_id",clientId)}catch(e){}
   localStorage.removeItem("tc_logo_"+clientId);

   try{
    let list=getRecentClientIds().filter(id=>id!==clientId);

   await home();

async function togglePosted(postId){
 if(!postId||postId==="undefined")return;
 const post=posts.find(p=>p.id===postId)||allPosts.find(p=>p.id===postId);
 if(!post)return;
 const newStatus=post.status==="posted"?"planned":"posted";
 post.status=newStatus;

 if(cur){
  if(adminView==="overview") renderClientOverview();
  else if(adminView==="cal") renderCalendarView();
  else if(adminView==="feed") renderFeedView();
  else if(adminView==="strategy") renderStrategyView();
  else if(adminView==="docs") renderDocsView();
  else if(adminView==="reports") renderReportsView();
  else renderList();
 }else{
  loadDashboard();
 }

 try{
  const {error}=await sb.from("posts").update({status:newStatus,updated_at:new Date().toISOString()}).eq("id",postId);
  if(error){
   console.error("Error toggling status:",error);
   alert("Failed to update status: "+error.message);
   if(cur)loadPosts();
  }
 }catch(err){console.error(err)}
}

 const activePosts=posts.filter(p=>p.status!=="posted");
 const postedPosts=posts.filter(p=>p.status==="posted");

 $("contentArea").innerHTML=`<div class="panel" id="list">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
   <div>
    <h2 style="margin:0">${esc(cur.name)} Posts</h2>
    <p class="muted" style="margin:4px 0 0">${activePosts.length} active scheduled · ${postedPosts.length} already posted</p>
   </div>
   ${postedPosts.length?`
    <button id="togglePastBtn" style="font-size:13px;padding:6px 14px">
     <span class="material-symbols-outlined" style="font-size:16px">${showPastPosted?'expand_less':'history'}</span>
     ${showPastPosted?'Hide past posted':'View past posted ('+postedPosts.length+')'}
    </button>
   `:""}
  </div>

  <!-- Active / Upcoming Posts -->
  ${activePosts.length?activePosts.map(p=>renderPostRow(p,false)).join(""):`<p class="muted">No upcoming posts scheduled. Click “Add post” above to plan new content.</p>`}

  <!-- Past Posted Section (Hidden by default) -->
  ${postedPosts.length&&showPastPosted?`
   <div style="margin-top:20px;border-top:1.5px dashed var(--line);padding-top:14px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
     <span class="material-symbols-outlined" style="color:#2E7D32">history</span>
     <b style="font-size:14px">Past Posted Content (${postedPosts.length})</b>
    </div>
    ${postedPosts.map(p=>renderPostRow(p,true)).join("")}
   </div>
  `:""}
 </div>`;

 if($("togglePastBtn")){
  $("togglePastBtn").onclick=()=>{
   showPastPosted=!showPastPosted;
   renderList();
  };
 }

 $("list").querySelectorAll("[data-tick]").forEach(b=>b.onclick=()=>togglePosted(b.dataset.tick));
 $("list").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>postForm(posts.find(p=>p.id===b.dataset.e)));
 $("list").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>confirmDeletePost(b.dataset.x));
}

function renderPostRow(p,isMuted){
 const isPosted=p.status==="posted";
 return `
  <div class="row" style="${isMuted?'opacity:0.82':''}">
   <b class="d">${p.post_date}</b>
   <div>
    <b>${esc(p.type)}</b> · ${esc(p.pillar)}
    <div class="muted">${esc(p.content||'—')} · ${p.status}</div>
   </div>
   <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">

// 2. Calendar View
function renderCalendarView(){
 const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
 const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
 const KINDS={Poster:"Poster",Reel:"Reel",Collab:"Collab",Spl:"Special day"};
 const CV={Poster:["--poster","--posterbg"],Reel:["--reel","--reelbg"],Collab:["--collab","--collabbg"],Spl:["--spl","--splbg"]};
 const kind=p=>p.pillar==="Spl Day"?"Spl":p.pillar==="Collab"?"Collab":p.type;

 const byDate={};
 posts.forEach(p=>{
  if(!byDate[p.post_date])byDate[p.post_date]=[];
  byDate[p.post_date].push({...p,k:kind(p)});
 });

 const firstDay=new Date(adminCalY,adminCalM,1).getDay();
 const daysInMonth=new Date(adminCalY,adminCalM+1,0).getDate();

 let gridHtml="";
 for(let i=0;i<firstDay;i++)gridHtml+=`<div class="day empty"></div>`;
 for(let d=1;d<=daysInMonth;d++){
  const key=`${adminCalY}-${pad(adminCalM+1)}-${pad(d)}`;
  const dayPosts=byDate[key]||[];
  const filteredPosts=dayPosts.filter(p=>adminCalFilter==="All"||p.k===adminCalFilter);

  let chipsHtml="";
  filteredPosts.slice(0,3).forEach(p=>{
   const isPosted=p.status==="posted";
   chipsHtml+=`<span class="chip ${p.k}"><b>${esc(p.type)}${isPosted?' ✓':(p.status==='ready'?' ★':'')}</b><i>${esc(p.pillar)}</i></span>`;
  });
  if(filteredPosts.length>3){
   chipsHtml+=`<span style="font-size:10px;color:var(--mute)">+${filteredPosts.length-3} more</span>`;
  }

  gridHtml+=`<button class="day${key===TODAY?' today':''}${key===adminCalSel?' sel':''}" data-d="${key}" aria-label="${d}">
   <span class="n">${d}</span>
   ${chipsHtml}
  </button>`;
 }

 const [yy,mm,dd]=adminCalSel.split("-").map(Number);
 const dt=new Date(yy,mm-1,dd);
 const title=`${DN[dt.getDay()]}, ${dd} ${MN[mm-1]} ${yy}`;
 const selPosts=byDate[adminCalSel]||[];

 $("contentArea").innerHTML=`
  <div class="panel">
   <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">
    <div>
     <h2 style="margin:0">${esc(cur.name)} · Calendar</h2>
     <p class="muted" style="margin:2px 0 0">Interactive visual calendar view</p>
    </div>
   </div>

   <div class="bar" id="adminFilters" role="group">
    ${["All",...Object.keys(KINDS)].map(k=>`
     <button class="${adminCalFilter===k?'on':''}" data-k="${k}">${k==="All"?"All":`<span class="dot" style="background:var(${CV[k][0]})"></span>${KINDS[k]}`}</button>
    `).join("")}
   </div>

   <div class="bar">
    <button id="adminPrev"><span class="material-symbols-outlined">chevron_left</span> Prev</button>
    <div class="month">${MN[adminCalM]} ${adminCalY}</div>
    <button id="adminNext">Next <span class="material-symbols-outlined">chevron_right</span></button>
    <span class="sp"></span>
    <button id="adminToday"><span class="material-symbols-outlined">today</span> Jump to today</button>
   </div>

   <div class="grid">${DN.map(d=>`<div class="dow">${d}</div>`).join("")}</div>
   <div class="grid" style="margin-top:6px">${gridHtml}</div>

   <div class="panel" style="margin-top:16px;background:var(--head)">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
     <h3 style="margin:0">${title}</h3>
     <button style="font-size:13px;padding:5px 12px" id="addDayPost"><span class="material-symbols-outlined">add</span> Add post for this day</button>
    </div>
    ${selPosts.length?`
     <div style="margin-top:12px;display:flex;flex-direction:column;gap:10px">
      ${selPosts.map(p=>{
       const c=CV[p.k];
       const isPosted=p.status==="posted";
       const refLink=/^https?:\/\//.test(p.ref_link||"")?`<a href="${esc(p.ref_link)}" target="_blank" rel="noopener">Instagram Link</a>`:"None added";
       return `
        <div class="row" style="background:var(--card);padding:12px;border-radius:10px;border:1px solid var(--line)">
         <div style="display:flex;flex-direction:column;gap:4px">
          <span class="tag" style="background:var(${c[1]});border:1.5px solid var(${c[0]});width:fit-content">${esc(p.type)}</span>
          <span class="muted" style="font-size:12px">Pillar: <b>${esc(p.pillar)}</b></span>
         </div>
         <div>
          <b>${esc(p.content||"No description")}</b>
          <div class="muted" style="font-size:12px;margin-top:2px">Ref: ${refLink}</div>
         </div>
         <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
          <button class="tick-btn ${isPosted?'ticked':''}" data-tick="${p.id}" title="${isPosted?'Click to mark as not posted':'Click to verify as posted'}">
           <span class="material-symbols-outlined" style="font-size:16px;color:${isPosted?'#2E7D32':'inherit'}">${isPosted?'check_circle':'radio_button_unchecked'}</span>
           ${isPosted?'Posted':'Mark posted'}
          </button>
          <button data-e="${p.id}"><span class="material-symbols-outlined" style="font-size:15px">edit</span> Edit</button>
          <button class="danger" data-x="${p.id}"><span class="material-symbols-outlined" style="font-size:15px">delete</span> Delete</button>
         </div>
        </div>`;
      }).join("")}
     </div>
    `:`<p class="muted" style="margin:12px 0 0">No posts scheduled for this day.</p>`}
   </div>
  </div>`;

 $("addDayPost").onclick=()=>postForm({post_date:adminCalSel});

 $("adminFilters").querySelectorAll("button").forEach(b=>{
  b.onclick=()=>{adminCalFilter=b.dataset.k;renderCalendarView()};
 });

 $("adminPrev").onclick=()=>{
  adminCalM--;
  if(adminCalM<0){adminCalM=11;adminCalY--}
  renderCalendarView();
 };
 $("adminNext").onclick=()=>{
  adminCalM++;
  if(adminCalM>11){adminCalM=0;adminCalY++}
  renderCalendarView();
 };
 $("adminToday").onclick=()=>{
  adminCalY=now.getFullYear();
  adminCalM=now.getMonth();
  adminCalSel=TODAY;
  renderCalendarView();
 };

 $("contentArea").querySelectorAll("button.day").forEach(b=>{
  b.onclick=()=>{adminCalSel=b.dataset.d;renderCalendarView()};
 });
 $("contentArea").querySelectorAll("[data-tick]").forEach(b=>{
  b.onclick=()=>togglePosted(b.dataset.tick);
 });
 $("contentArea").querySelectorAll("[data-e]").forEach(b=>{
  b.onclick=()=>postForm(posts.find(p=>p.id===b.dataset.e));
 });
 $("contentArea").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>confirmDeletePost(b.dataset.x));
}

// 4. Client Canvas / Content Hub & Docs (White Theme with Dark Font + Print PDF)
function getClientCanvas(c){
 if(c.canvas&&typeof c.canvas==="object")return c.canvas;
 try{
  const cached=JSON.parse(localStorage.getItem("tc_canvas_"+c.id));
  if(cached)return cached;
 }catch(e){}
 return {
  pillars:["Menu","Authenticity","Reels Concept","Collab","Special Day","Behind The Scenes"],
  links:[
   {name:"Brand Guidelines",url:"https://drive.google.com"},
   {name:"Instagram Inspiration Board",url:"https://instagram.com"}
  ],
  notes:"# Content Strategy & Brand Canvas\n\n### Tone of Voice\n- Friendly, engaging, visually authentic\n\n### Key Content Objectives\n- Drive foot traffic\n- Showcase signature items\n- Highlight behind-the-scenes craft"
 };
}

function parseMarkdown(md){
 if(!md)return '<p class="muted">No canvas notes added yet.</p>';
 return esc(md)
  .replace(/^### (.*$)/gim,'<h4 style="margin:12px 0 4px">$1</h4>')
  .replace(/^## (.*$)/gim,'<h3 style="margin:14px 0 6px">$1</h3>')
  .replace(/^# (.*$)/gim,'<h2 style="margin:16px 0 8px">$1</h2>')
  .replace(/^\> (.*$)/gim,'<blockquote>$1</blockquote>')
  .replace(/\*\*(.*?)\*\*/gim,'<b>$1</b>')
  .replace(/\*(.*?)\*/gim,'<i>$1</i>')
  .replace(/\[(.*?)\]\((.*?)\)/gim,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/^\- (.*$)/gim,'• $1<br>')
  .replace(/\n/gim,'<br>');
}

  canvas.pillars.push(val);
  renderStrategyView();
 };
 $("pillarChips").querySelectorAll("[data-delp]").forEach(b=>{
  b.onclick=()=>{
   const idx=+b.dataset.delp;
   canvas.pillars.splice(idx,1);
   renderStrategyView();
  };
 });

 // Markdown view toggle (Preview by default)
 $("tabMdPrev").onclick=()=>{
  if($("canvasNotesInput")) canvas.notes=$("canvasNotesInput").value;
  $("tabMdPrev").classList.add("on");$("tabMdEdit").classList.remove("on");
  $("mdEditView").style.display="none";$("mdPrevView").style.display="block";
  $("mdPrevView").innerHTML=parseMarkdown(canvas.notes);
 };

 };

  const reader=new FileReader();
  reader.onload=re=>{
   canvas.notes=re.target.result;
   if($("canvasNotesInput")) $("canvasNotesInput").value=canvas.notes;
   $("mdPrevView").innerHTML=parseMarkdown(canvas.notes);
   saveStrategy();
  };
  reader.readAsText(f);
 };

 $("printCanvasBtn").onclick=()=>{
  if($("canvasNotesInput")) canvas.notes=$("canvasNotesInput").value;
  window.print();
 };

 $("saveStrategyBtn").onclick=saveStrategy;

 async function saveStrategy(){
  if(!cur||!cur.id||cur.id==="undefined")return;
  if($("canvasNotesInput")) canvas.notes=$("canvasNotesInput").value;
  $("strategyMsg").textContent="Saving strategy…";
  localStorage.setItem("tc_canvas_"+cur.id,JSON.stringify(canvas));
  try{
   const {error}=await sb.from("clients").update({canvas}).eq("id",cur.id);
   if(error){
    $("strategyMsg").textContent="✓ Saved locally! (Run supabase-setup.sql to sync in cloud)";
   }else{
    $("strategyMsg").textContent="✓ Strategy saved successfully!";
   }
   setTimeout(()=>{if($("strategyMsg"))$("strategyMsg").textContent=""},3000);
  }catch(err){
   $("strategyMsg").textContent="✓ Saved locally!";
  }
 }
}

   $("cpcHint").innerHTML="";
   $("cpc").style.borderColor="";

   $("cp").style.borderColor="#2E7D32";
  }

  // Confirm password validation
  if(pw.length>=4){
   if(cpw.length===0){
    $("cpcHint").innerHTML=`<span class="muted">Re-type password to verify</span>`;
    $("cpc").style.borderColor="";
    isValid=false;

   $("cpc").style.borderColor="var(--bad)";
   isValid=false;

 };

async function commitClientSave(c,name,slug,accent_color,username,password,logo_url){
 const isEdit=Boolean(c&&c.id&&c.id!=="undefined");
 let row={name,slug,accent_color,logo_url};
 let data=null,error=null;

 const res=isEdit?await sb.from("clients").update(row).eq("id",c.id).select().single():await sb.from("clients").insert(row).select().single();
 data=res.data;
 error=res.error;

 if(error&&error.message&&error.message.includes("logo_url")){
  delete row.logo_url;
  const retry=isEdit?await sb.from("clients").update(row).eq("id",c.id).select().single():await sb.from("clients").insert(row).select().single();
  data=retry.data;
  error=retry.error;
 }

 if(error&&error.message&&(error.message.includes("clients_slug_key")||error.message.includes("slug"))){
  // Auto-deduplicate slug if collision occurs in the database
  const randomSuffix=Math.random().toString(36).substring(2,6);
  row.slug=`${slug}-${randomSuffix}`;
  const retrySlug=isEdit?await sb.from("clients").update(row).eq("id",c.id).select().single():await sb.from("clients").insert(row).select().single();
  data=retrySlug.data;
  error=retrySlug.error;
 }

 if(error){
  const msgEl=$("msg")||$("step2Msg");
  if(msgEl){
   if(error.message.includes("clients_slug_key")){
    msgEl.textContent="A client with a similar name or slug already exists. Please choose a different name.";
   }else{
    msgEl.textContent=error.message;
   }
  }
  const confirmBtn=$("confirmStep2"),saveBtn=$("sv");
  if(confirmBtn) confirmBtn.disabled=false;
  if(saveBtn) saveBtn.disabled=false;
  return;
 }

 if(!data||!data.id){
  try{
   const {data:fetched}=await sb.from("clients").select("*").eq("slug",row.slug).maybeSingle();
   if(fetched&&fetched.id) data=fetched;
  }catch(e){}
 }

 if(!data||!data.id){
  const msgEl=$("msg")||$("step2Msg");
  if(msgEl) msgEl.textContent="Client saved, but could not retrieve ID. Please refresh.";
  const confirmBtn=$("confirmStep2"),saveBtn=$("sv");
  if(confirmBtn) confirmBtn.disabled=false;
  if(saveBtn) saveBtn.disabled=false;
  return;
 }

 cur=data;
 cur.logo_url=logo_url;
 if(logo_url){
  localStorage.setItem("tc_logo_"+cur.id,logo_url);
 }else{
  localStorage.removeItem("tc_logo_"+cur.id);
 }

 if(username&&password&&cur&&cur.id&&cur.id!=="undefined"){
  try{
   const {data:rpcData,error:rpcErr}=await sb.rpc("admin_set_client_login",{p_client_id:cur.id,p_username:username,p_password:password});
   if(rpcErr){console.warn("Supabase RPC admin_set_client_login pending:",rpcErr.message)}
   else if(rpcData&&!rpcData.success){
    const msgEl=$("msg")||$("step2Msg");
    if(msgEl){msgEl.textContent=rpcData.error;return}
   }
  }catch(e){console.warn("RPC not yet created:",e)}
 }
 closeModal();
 await home();
}

// Option A: Client-Side Image Compression & WebP Conversion (Max 1440px, Quality 0.82)
async function compressImage(file, maxDimension=1440, quality=0.82){
 if(!file||!file.type.startsWith("image/")||file.type==="image/gif"||file.type==="image/svg+xml"){
  return file;
 }
 return new Promise((resolve)=>{
  const reader=new FileReader();
  reader.onerror=()=>resolve(file);
  reader.onload=e=>{
   const img=new Image();
   img.onerror=()=>resolve(file);
   img.onload=()=>{
    let w=img.width,h=img.height;
    if(w>maxDimension||h>maxDimension){
     if(w>h){
      h=Math.round((h*maxDimension)/w);
      w=maxDimension;
     }else{
      w=Math.round((w*maxDimension)/h);
      h=maxDimension;
     }
    }
    const canvas=document.createElement("canvas");
    canvas.width=w;
    canvas.height=h;
    const ctx=canvas.getContext("2d");
    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality="high";
    ctx.drawImage(img,0,0,w,h);

    canvas.toBlob(blob=>{
     if(!blob||blob.size>=file.size){
      resolve(file);
     }else{
      const baseName=file.name.replace(/\.[^/.]+$/,"");
      const compressed=new File([blob],`${baseName}.webp`,{type:"image/webp"});
      resolve(compressed);
     }
    },"image/webp",quality);
   };
   img.src=e.target.result;
  };
  reader.readAsDataURL(file);
 });
}

// Post Form Popup Modal
function postForm(p){
 const o=(arr,v)=>arr.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("");
 const canvas=getClientCanvas(cur||{});
 const html=`
  <div class="modal-header-row">
   <h2 style="margin:0">${p.id?"Edit post":"New post"}</h2>
   <button class="modal-close-btn" id="closePostModal" type="button">

   </button>
  </div>
  <div class="two">
   <div><label>Date</label><input id="pd" type="date" value="${p.post_date||""}"></div>
   <div><label>Type</label><select id="pt">${o(["Poster","Reel"],p.type)}</select></div>
  </div>
  <div class="two">
   <div>

   </div>
   <div><label>Status</label><select id="ps">${o(["planned","designed","ready","posted"],p.status||"planned")}</select></div>
  </div>
  <label>Content</label><textarea id="pc" rows="2">${esc(p.content)}</textarea>
  <label>Instagram reference link</label><input id="pl" value="${esc(p.ref_link)}" placeholder="https://www.instagram.com/p/…">
  <label>Final post image (Auto-compressed to WebP)</label><input id="pi" type="file" accept="image/*">${p.image_url?`<p class="muted">The current image is kept unless you choose a new one.</p>`:""}
  <p class="msg" id="msg"></p>
  <div class="bar">
   <button class="pri" id="sv"><span class="material-symbols-outlined">save</span> Save post</button>
   <button id="cx" type="button">Cancel</button>
   ${p.id?`
    <span class="sp"></span>
    <button class="danger" id="delpForm" type="button"><span class="material-symbols-outlined">delete</span> Delete post</button>
   `:""}
  </div>`;

 openModal(html);
 $("closePostModal").onclick=closeModal;
 $("cx").onclick=closeModal;
 if(p.id){
  $("delpForm").onclick=()=>{closeModal();confirmDeletePost(p.id)};
 }

 $("sv").onclick=async()=>{
  if(!cur||!cur.id||cur.id==="undefined"){
   $("msg").textContent="Please select a valid client first.";
   return;
  }
  const date=$("pd").value;
  if(!date){$("msg").textContent="Pick a date.";return}
  $("sv").disabled=true;
  $("msg").textContent="Saving post…";

  let image_url=p.image_url||null;const f=$("pi").files[0];
  if(f){
   const origMb=(f.size/(1024*1024)).toFixed(1);
   $("msg").textContent=`Optimizing image (${origMb}MB)…`;
   const compressed=await compressImage(f,1440,0.82);
   const newKb=(compressed.size/1024).toFixed(0);
   $("msg").textContent=`Uploading optimized image (${newKb}KB)…`;
   const ext=compressed.type==="image/webp"?"webp":f.name.split(".").pop();
   const path=`${cur.slug}/${date}-${Date.now()}.${ext}`;
   const {error}=await sb.storage.from("post-images").upload(path,compressed,{
    contentType:compressed.type||"image/webp",
    cacheControl:"31536000, immutable"
   });
   if(error){$("msg").textContent=error.message;$("sv").disabled=false;return}
   image_url=sb.storage.from("post-images").getPublicUrl(path).data.publicUrl;
  }
  const row={client_id:cur.id,post_date:date,type:$("pt").value,pillar:$("pp").value.trim(),content:$("pc").value.trim(),ref_link:$("pl").value.trim()||null,status:$("ps").value,image_url,updated_at:new Date().toISOString()};
  const {error}=p.id?await sb.from("posts").update(row).eq("id",p.id):await sb.from("posts").insert(row);
  if(error){$("msg").textContent=error.message;$("sv").disabled=false;return}
  closeModal();
  loadPosts();
 };
}
